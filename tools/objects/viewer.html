<!doctype html>
<!--
  S.T.U.N. Runner object viewer (docs/07-objects.md section 11.5): a verification aid for the
  meshes in data/objects, not a product. Serve the repository root and open this page:

      make view        (python3 -m http.server --bind 127.0.0.1 8000, from the repo root)
      http://127.0.0.1:8000/tools/objects/viewer.html#48

  It reads ../../data/objects/manifest.json and NNN.json. Object space is left-handed (x right,
  y up, z forwards, docs/07 section 11.1); the page shows it in Three.js's right-handed space as
  (x, y, -z), so nothing is mirrored. Faces are culled the way the ADSP culls them (PM 01A8-01A9:
  drawn when the stored normal points at the eye, normal . (first vertex - eye) < 0), colour 0
  faces are hidden (019F), colours are the made-up index colours of tools/objects/render.py.
  The only dependency is Three.js r128 from cdnjs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object viewer</title>
<style>
  :root { --bg: #181a20; --fg: #e6e6e6; --dim: #9aa0a6; --panel: #23262e; --accent: #7fc4ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #ui { position: absolute; top: 8px; left: 8px; width: 300px; max-width: calc(100% - 16px);
    background: var(--panel); padding: 10px; border-radius: 6px; z-index: 2; }
  #ui input[type=text], #ui input[type=number] { width: 100%; background: #111; color: var(--fg);
    border: 1px solid #444; padding: 4px; font: inherit; }
  #ui label { display: block; margin: 2px 0; }
  #ui .row { display: flex; gap: 6px; margin: 6px 0; }
  #ui button { background: #333; color: var(--fg); border: 1px solid #555; padding: 3px 8px;
    font: inherit; cursor: pointer; }
  #info { color: var(--dim); white-space: pre-wrap; margin-top: 6px; }
  #name { color: var(--accent); }
  #err { color: #ff8a80; white-space: pre-wrap; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #labels span { position: absolute; font-size: 10px; transform: translate(-50%, -50%); }
  #labels .v { color: #ffe082; } #labels .f { color: #80deea; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div class="row">
    <input id="num" type="number" min="0" value="0" title="object number">
    <button id="prev" title="previous">&lt;</button><button id="next" title="next">&gt;</button>
  </div>
  <input id="search" type="text" list="names" placeholder="name (type to search)">
  <datalist id="names"></datalist>
  <div class="row">
    <label><input id="wire" type="checkbox"> wireframe</label>
    <label><input id="cull" type="checkbox" checked> ADSP culling</label>
  </div>
  <div class="row">
    <label><input id="normals" type="checkbox"> face normals</label>
    <label><input id="axes" type="checkbox" checked> axes</label>
  </div>
  <div class="row">
    <label><input id="vidx" type="checkbox"> vertex indices</label>
    <label><input id="fidx" type="checkbox"> face indices</label>
  </div>
  <div class="row">
    <button id="reload" title="re-read the mesh file (after an edit)">reload</button>
    <label><input id="auto" type="checkbox"> reload every second</label>
  </div>
  <div id="name"></div>
  <div id="info"></div>
  <div id="err"></div>
</div>
<div id="labels"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const DATA = "../../data/objects/";
const $ = (id) => document.getElementById(id);
const GOLDEN = 0.6180339887498949;
const LIGHT = [-0.48, 0.64, -0.6];

// The index colour and the shading of tools/objects/render.py (index_rgb, face_rgb).
function indexRgb(c) {
  const h = (c * GOLDEN) % 1, s = 0.55, v = 0.95;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
  const rgb = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
  return rgb.map((x) => Math.round(x * 255));
}
function faceRgb(mesh, face) {
  const base = indexRgb(face.colour);
  if (face.type === 1 || face.colour >= 0x1f) return base;
  const n = mesh.normals[face.normal];
  const len = Math.hypot(n[0], n[1], n[2]);
  const lit = len ? Math.max(0, (n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]) / len) : 0;
  return base.map((x) => Math.min(255, Math.floor(x * (0.35 + 0.65 * lit))));
}
// object space (left-handed) -> Three.js (right-handed)
const P = (v) => new THREE.Vector3(v[0], v[1], -v[2]);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181a20);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 1e6);
const root = new THREE.Group();
scene.add(root);

let manifest = null, mesh = null, number = 0, stamp = "";
let target = new THREE.Vector3(), radius = 100;
let yaw = Math.PI / 4, pitch = 0.5, dist = 3;   // orbit about the bounding box centre

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);

function eyeObject() {
  // the eye in object space: Three.js (x, y, z) -> object (x, y, -z)
  return [camera.position.x, camera.position.y, -camera.position.z];
}

let faceMesh = null, edgeLines = null, normalLines = null, axes = null;

function build() {
  root.clear();
  $("labels").textContent = "";
  if (!mesh) return;
  const V = mesh.vertices;
  const lo = [0, 1, 2].map((k) => Math.min(...V.map((v) => v[k])));
  const hi = [0, 1, 2].map((k) => Math.max(...V.map((v) => v[k])));
  target = P([(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (lo[2] + hi[2]) / 2]);
  radius = Math.max(1, Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2);

  // A type 1 face is an image command (emit_image 0663), not a polygon: the GSP draws the image
  // its colour field names as a box from corner 0 (docs/08 4.4). It is marked by its outline and
  // diagonals in its index colour, unfilled, as tools/objects/render.py does.
  const pos = [], col = [], img = [], imgCol = [];
  mesh.faces.forEach((f, k) => {
    f.start = pos.length / 3;
    const c = faceRgb(mesh, f).map((x) => x / 255);
    if (f.type === 1) {
      const n = f.vertices.length;
      const pairs = [...Array(n).keys()].map((i) => [i, (i + 1) % n]);
      if (n === 4) pairs.push([0, 2], [1, 3]);
      for (const [i, j] of pairs) {
        const a = P(V[f.vertices[i]]), b = P(V[f.vertices[j]]);
        img.push(a.x, a.y, a.z, b.x, b.y, b.z); imgCol.push(...c, ...c);
      }
      f.end = f.start;
      return;
    }
    for (let i = 1; i + 1 < f.vertices.length; i++) {
      for (const j of [0, i, i + 1]) {
        const p = P(V[f.vertices[j]]);
        pos.push(p.x, p.y, p.z); col.push(...c);
      }
    }
    f.end = pos.length / 3;
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex([]);
  faceMesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors: true, side: THREE.DoubleSide, polygonOffset: true,
    polygonOffsetFactor: 1, polygonOffsetUnits: 1 }));
  root.add(faceMesh);
  const ig = new THREE.BufferGeometry();
  ig.setAttribute("position", new THREE.Float32BufferAttribute(img, 3));
  ig.setAttribute("color", new THREE.Float32BufferAttribute(imgCol, 3));
  root.add(new THREE.LineSegments(ig, new THREE.LineBasicMaterial({ vertexColors: true })));

  const e = [];
  for (const f of mesh.faces) {
    const n = f.vertices.length;
    for (let i = 0; i < (n > 2 ? n : 1); i++) {
      const a = P(V[f.vertices[i]]), b = P(V[f.vertices[(i + 1) % n]]);
      e.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute("position", new THREE.Float32BufferAttribute(e, 3));
  edgeLines = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({ color: 0x000000,
    transparent: true, opacity: 0.45 }));
  root.add(edgeLines);

  const nl = [], len = radius * 0.15;
  for (const f of mesh.faces) {
    const c = centroid(f), n = mesh.normals[f.normal], l = Math.hypot(...n) || 1;
    const a = P(c), b = P([c[0] + n[0] / l * len, c[1] + n[1] / l * len, c[2] + n[2] / l * len]);
    nl.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
  const ng = new THREE.BufferGeometry();
  ng.setAttribute("position", new THREE.Float32BufferAttribute(nl, 3));
  normalLines = new THREE.LineSegments(ng, new THREE.LineBasicMaterial({ color: 0xff4081 }));
  root.add(normalLines);

  axes = new THREE.Group();   // x red, y green, z blue (object +z drawn towards Three.js -z)
  [[1, 0, 0, 0xff5252], [0, 1, 0, 0x69f0ae], [0, 0, 1, 0x448aff]].forEach(([x, y, z, c]) => {
    const ag = new THREE.BufferGeometry().setFromPoints([P([0, 0, 0]),
      P([x * radius * 0.5, y * radius * 0.5, z * radius * 0.5])]);
    axes.add(new THREE.Line(ag, new THREE.LineBasicMaterial({ color: c })));
  });
  root.add(axes);

  const labels = $("labels");
  V.forEach((v, i) => labels.appendChild(tag("v", i, v)));
  mesh.faces.forEach((f, k) => labels.appendChild(tag("f", k, centroid(f))));

  const nf = mesh.faces.length;
  const types = {}; mesh.faces.forEach((f) => { types[f.type] = (types[f.type] || 0) + 1; });
  $("info").textContent =
    `vertices ${V.length}, normals ${mesh.normals.length}, faces ${nf}\n` +
    `face types ${Object.entries(types).map(([t, c]) => `${t}: ${c}`).join(", ")}\n` +
    `x ${lo[0]}..${hi[0]}\ny ${lo[1]}..${hi[1]}\nz ${lo[2]}..${hi[2]}\n` +
    `drag: orbit, wheel: zoom; x right, y up, z forwards`;
}

function centroid(f) {
  const c = [0, 0, 0];
  for (const i of f.vertices) for (let k = 0; k < 3; k++) c[k] += mesh.vertices[i][k];
  return c.map((x) => x / f.vertices.length);
}
function tag(kind, i, p) {
  const s = document.createElement("span");
  s.className = kind; s.textContent = i; s.dataset.p = JSON.stringify(p);
  return s;
}

function update() {
  if (!mesh || !faceMesh) return;
  const eye = eyeObject(), cull = $("cull").checked, idx = [];
  const visible = mesh.faces.map((f) => {
    if (f.colour === 0) return false;
    if (!cull) return true;
    const n = mesh.normals[f.normal], v = mesh.vertices[f.vertices[0]];
    return n[0] * (v[0] - eye[0]) + n[1] * (v[1] - eye[1]) + n[2] * (v[2] - eye[2]) < 0;
  });
  mesh.faces.forEach((f, k) => { if (visible[k]) for (let i = f.start; i < f.end; i++) idx.push(i); });
  faceMesh.geometry.setIndex(idx);
  faceMesh.material.wireframe = $("wire").checked;
  edgeLines.visible = !$("wire").checked;
  normalLines.visible = $("normals").checked;
  axes.visible = $("axes").checked;
  const w = window.innerWidth, h = window.innerHeight;
  const showV = $("vidx").checked, showF = $("fidx").checked;
  for (const s of $("labels").children) {
    const on = s.className === "v" ? showV : showF && visible[+s.textContent];
    if (!on) { s.style.display = "none"; continue; }
    const q = P(JSON.parse(s.dataset.p)).project(camera);
    s.style.display = q.z < 1 ? "" : "none";
    s.style.left = ((q.x + 1) / 2 * w) + "px";
    s.style.top = ((1 - q.y) / 2 * h) + "px";
  }
}

function place() {
  const d = radius * dist;
  camera.position.set(target.x + d * Math.cos(pitch) * Math.sin(yaw), target.y + d * Math.sin(pitch),
    target.z + d * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt(target);
  camera.near = Math.max(0.1, d - radius * 4); camera.far = d + radius * 4;
  camera.updateProjectionMatrix();
}

function frame() {
  place(); update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

async function load(n, keepView) {
  $("err").textContent = "";
  try {
    const name = String(n).padStart(3, "0") + ".json";
    const res = await fetch(DATA + name, { cache: "no-store" });
    if (!res.ok) throw new Error(`${DATA}${name}: HTTP ${res.status}`);
    const text = await res.text();
    if (keepView && text === stamp) return;
    stamp = text;
    mesh = JSON.parse(text);
    number = n;
    $("num").value = n;
    $("name").textContent = `${n}: ${manifest.names[String(n)] || "(no name)"}`;
    if (location.hash !== "#" + n) history.replaceState(null, "", "#" + n);
    build();
  } catch (e) {
    $("err").textContent = String(e);
  }
}

let drag = null;
renderer.domElement.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; });
window.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag[0]) * 0.01;
  pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.01));
  drag = [e.clientX, e.clientY];
});
renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault(); dist = Math.max(0.3, Math.min(20, dist * Math.exp(e.deltaY * 0.001)));
}, { passive: false });

$("num").addEventListener("change", () => load(+$("num").value));
$("prev").addEventListener("click", () => load(Math.max(0, number - 1)));
$("next").addEventListener("click", () => load(Math.min(manifest.objects - 1, number + 1)));
$("reload").addEventListener("click", () => load(number, true));
$("search").addEventListener("change", () => {
  const q = $("search").value.trim();
  const hit = Object.entries(manifest.names).find(([k, v]) => v === q || k === q)
    || Object.entries(manifest.names).find(([, v]) => v.includes(q));
  if (hit) load(+hit[0]);
});
setInterval(() => { if ($("auto").checked) load(number, true); }, 1000);

(async () => {
  resize();
  try {
    const res = await fetch(DATA + "manifest.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`${DATA}manifest.json: HTTP ${res.status}`);
    manifest = await res.json();
  } catch (e) {
    $("err").textContent = `${e}\nServe the repository root (make view) and open ` +
      `http://127.0.0.1:8000/tools/objects/viewer.html`;
    return;
  }
  $("num").max = manifest.objects - 1;
  const dl = $("names");
  for (const [k, v] of Object.entries(manifest.names)) {
    const o = document.createElement("option"); o.value = v; o.label = k; dl.appendChild(o);
  }
  await load(+(location.hash.slice(1) || 0));
  frame();
})();
</script>
</body>
</html>
